[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*,tools/*,docs/*,web/*,README.md,assets/art/island.webp,assets/art/soccer.png,assets/art/penguin.png,assets/art/basketball.png,assets/art/baseball.png,assets/art/panda.png,assets/art/rabbit.png,assets/art/giraffe.png,assets/art/elephant.png,assets/art/dog.png,assets/art/lion.png,assets/art/cat.png,assets/art/table-tennis.png"
export_path="../builds/alan-island/index.html"
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#217e76\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
